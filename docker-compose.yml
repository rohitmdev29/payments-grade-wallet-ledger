# Port mapping notes:
#   Host 5436 -> container 5432 (Postgres)
#   Host 8001 -> container 8000 (API)

services:
  db:
    image: postgres:15
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@db:5432/wallet
      LLM_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.workers.nightly_reconciliation
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@db:5432/wallet
      LLM_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
